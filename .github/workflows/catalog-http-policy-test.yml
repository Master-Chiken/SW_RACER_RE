name: Catalog HTTP policy tests

on:
  push:
    paths:
      - ".github/workflows/catalog-http-policy-test.yml"
      - "dinput_hook/catalog_http_policy.h"
      - "dinput_hook/track_catalog.cpp"
      - "tests/catalog_http_policy_test.cpp"
  pull_request:
    paths:
      - ".github/workflows/catalog-http-policy-test.yml"
      - "dinput_hook/catalog_http_policy.h"
      - "dinput_hook/track_catalog.cpp"
      - "tests/catalog_http_policy_test.cpp"

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: g++
            extra_flags: ""
          - compiler: clang++
            extra_flags: ""
          - compiler: g++
            extra_flags: "-fsanitize=address,undefined -fno-omit-frame-pointer"
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run catalog HTTP policy tests
        shell: bash
        run: |
          ${{ matrix.compiler }} -std=c++20 -Wall -Wextra -Werror -pedantic ${{ matrix.extra_flags }} tests/catalog_http_policy_test.cpp -o /tmp/catalog-http-policy-test
          /tmp/catalog-http-policy-test
