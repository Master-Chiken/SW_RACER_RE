name: Cinematic audio regression tests

on:
  push:
    paths:
      - "dinput_hook/cinematic_audio.h"
      - "dinput_hook/renderer_hook.cpp"
      - "tests/cinematic_audio_test.cpp"
      - ".github/workflows/cinematic-audio-test.yml"
  pull_request:
    branches: [master]
    paths:
      - "dinput_hook/cinematic_audio.h"
      - "tests/cinematic_audio_test.cpp"
      - ".github/workflows/cinematic-audio-test.yml"

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Show compiler
        run: ${{ matrix.cxx }} --version
      - name: Compile regression tests
        run: ${{ matrix.cxx }} -std=c++20 -Wall -Wextra -Werror -pedantic tests/cinematic_audio_test.cpp -o cinematic_audio_test
      - name: Run regression tests
        run: ./cinematic_audio_test

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile with AddressSanitizer and UndefinedBehaviorSanitizer
        run: g++ -std=c++20 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer tests/cinematic_audio_test.cpp -o cinematic_audio_test
      - name: Run sanitizer build
        run: ./cinematic_audio_test
